name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: Unit tests & syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check (game, effects, formulas)
        run: npm run check
      - name: Unit tests
        run: npm test
